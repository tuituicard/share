<body class="flex justify-center min-h-screen" style="background-color: #1f2937; color: #ffffff;">
  <div id="app" v-cloak class="w-full max-w-md min-h-screen flex flex-col items-center px-6 pt-12 pb-16">
    <!-- 大頭貼與姓名副標 -->
    <img :src="profile['大頭貼圖片URL'] || 'https://via.placeholder.com/150'" @error="$event.target.src='https://via.placeholder.com/150'" class="w-[100px] h-[100px] rounded-full object-cover border-[3px] border-white shadow-md mb-4">
    <h1 class="text-2xl font-black tracking-widest text-center" :style="{ color: textColor, fontFamily: getFontFamily(profile['主標題字體']) }">{{ profile['顯示名稱'] }}</h1>
    <p v-if="cfg.subtitle" class="text-sm font-medium tracking-wider mt-1.5 opacity-85 text-center" :style="{ color: textColor, fontFamily: getFontFamily(profile['敘述文字體']) }">{{ cfg.subtitle }}</p>

    <!-- 服務項目膠囊標籤 -->
    <div v-if="tagList.length > 0" class="w-full mt-7">
      <div class="flex items-center gap-3 mb-4">
        <div class="h-[1px] flex-1 bg-current opacity-20"></div>
        <span class="text-xs font-bold tracking-widest opacity-85" style="color: #ffffff;">服務項目</span>
        <div class="h-[1px] flex-1 bg-current opacity-20"></div>
      </div>
      <div class="flex flex-wrap justify-center gap-2">
        <span v-for="(tag, idx) in tagList" :key="idx" class="px-3.5 py-1.5 rounded-full text-xs font-medium bg-white/85 backdrop-blur-sm shadow-sm text-gray-800">{{ tag }}</span>
      </div>
    </div>

    <!-- 白色聯絡卡片 -->
    <div v-if="cfg.contactPhone || cfg.contactEmail || cfg.contactLine" class="w-full bg-white rounded-3xl p-5 shadow-sm mt-7 text-gray-800">
      <div class="grid grid-cols-3 gap-2.5 mb-3">
        <a v-if="cfg.contactPhone" :href="'tel:' + cfg.contactPhone" class="bg-gray-100 hover:bg-gray-200 transition rounded-2xl py-3 flex flex-col items-center justify-center gap-1.5 text-xs font-bold text-gray-700"><i class="ph ph-phone text-xl"></i><span>撥電話</span></a>
        <div v-else class="bg-gray-50 rounded-2xl py-3 flex flex-col items-center justify-center gap-1.5 text-xs font-bold text-gray-300"><i class="ph ph-phone text-xl"></i><span>撥電話</span></div>
        <a v-if="cfg.contactLine" :href="buildLineAddUrl(cfg.contactLine)" target="_blank" class="bg-gray-100 hover:bg-gray-200 transition rounded-2xl py-3 flex flex-col items-center justify-center gap-1.5 text-xs font-bold text-gray-700"><i class="ph ph-chat-circle text-xl"></i><span>加 LINE</span></a>
        <div v-else class="bg-gray-50 rounded-2xl py-3 flex flex-col items-center justify-center gap-1.5 text-xs font-bold text-gray-300"><i class="ph ph-chat-circle text-xl"></i><span>加 LINE</span></div>
        <a v-if="cfg.contactEmail" :href="'mailto:' + cfg.contactEmail" class="bg-gray-100 hover:bg-gray-200 transition rounded-2xl py-3 flex flex-col items-center justify-center gap-1.5 text-xs font-bold text-gray-700"><i class="ph ph-envelope-simple text-xl"></i><span>寄 Email</span></a>
        <div v-else class="bg-gray-50 rounded-2xl py-3 flex flex-col items-center justify-center gap-1.5 text-xs font-bold text-gray-300"><i class="ph ph-envelope-simple text-xl"></i><span>寄 Email</span></div>
      </div>
      <button @click="downloadVCard" class="w-full py-3 rounded-xl text-white font-bold text-sm flex items-center justify-center gap-2 shadow-sm hover:opacity-90 transition" style="background-color: #1f2937;">
        <i class="ph ph-user-plus text-lg"></i> 存到手機聯絡人
      </button>
      <div class="mt-4 pt-3 border-t border-gray-100 space-y-2 text-xs">
        <div v-if="cfg.contactPhone" class="flex items-center"><span class="w-14 font-bold shrink-0" style="color: #1f2937;">手機</span><span class="text-gray-700 font-medium">{{ cfg.contactPhone }}</span></div>
        <div v-if="cfg.contactEmail" class="flex items-center"><span class="w-14 font-bold shrink-0" style="color: #1f2937;">Email</span><span class="text-gray-700 font-medium break-all">{{ cfg.contactEmail }}</span></div>
        <div v-if="cfg.contactLine" class="flex items-center"><span class="w-14 font-bold shrink-0" style="color: #1f2937;">LINE</span><span class="text-gray-700 font-medium">{{ cfg.contactLine }}</span></div>
      </div>
    </div>

    <!-- 關於我們 -->
    <div v-if="cfg.aboutUs" class="w-full mt-7">
      <div class="flex items-center gap-3 mb-3">
        <span class="text-xs font-bold tracking-widest shrink-0 opacity-85" style="color: #ffffff;">關於我們</span>
        <div class="h-[1px] flex-1 bg-current opacity-20"></div>
      </div>
      <p class="text-sm leading-relaxed whitespace-pre-wrap opacity-90" :style="{ color: textColor, fontFamily: getFontFamily(profile['敘述文字體']) }">{{ cfg.aboutUs }}</p>
    </div>

    <!-- 可以找我的事 -->
    <div v-if="serviceRows.length > 0" class="w-full mt-7">
      <div class="flex items-center gap-3 mb-3">
        <span class="text-xs font-bold tracking-widest shrink-0 opacity-85" style="color: #ffffff;">可以找我的事</span>
        <div class="h-[1px] flex-1 bg-current opacity-20"></div>
      </div>
      <div class="space-y-2.5">
        <template v-for="(item, idx) in serviceRows" :key="idx">
          <a v-if="item.url" :href="buildServiceUrl(item.url)" target="_blank" class="w-full bg-white rounded-full px-5 py-3 flex justify-between items-center shadow-sm hover:opacity-90 active:scale-[0.99] transition cursor-pointer" style="text-decoration: none;">
            <span class="text-sm font-bold" style="color: #1f2937;">{{ item.name }}</span>
            <span class="text-sm font-bold" style="color: #1f2937;">{{ item.price }}</span>
          </a>
          <div v-else class="w-full bg-white rounded-full px-5 py-3 flex justify-between items-center shadow-sm">
            <span class="text-sm font-bold" style="color: #1f2937;">{{ item.name }}</span>
            <span class="text-sm font-bold" style="color: #1f2937;">{{ item.price }}</span>
          </div>
        </template>
      </div>
    </div>

    <!-- LINK 連結 (沿用主頁按鈕管理) -->
    <div v-if="buttons.length > 0" class="w-full mt-7">
      <div class="flex items-center gap-3 mb-3">
        <span class="text-xs font-bold tracking-widest shrink-0 opacity-85" style="color: #ffffff;">LINK 連結</span>
        <div class="h-[1px] flex-1 bg-current opacity-20"></div>
      </div>
      <div class="space-y-3">
        <template v-for="(btn, index) in buttons" :key="index">
          <a v-if="btn['按鈕類型'] !== 'image'" :href="buildFinalLink(btn.type || 'url', btn['跳轉連結'] || btn.url)" target="_blank" @click="trackClickAsync(btn, index)" class="w-full flex items-center justify-center font-bold px-4 py-3.5 rounded-xl shadow-sm hover:opacity-90 transition text-sm tracking-wider" :style="{ backgroundColor: btn['按鈕背景顏色'] || '#1f2937', color: btn['按鈕文字顏色'] || '#ffffff', fontFamily: getFontFamily(btn['按鈕字體'] || btn.font) }">
            {{ btn['按鈕文字'] || btn.title }}
          </a>
        </template>
      </div>
    </div>

    <!-- 公司資訊 -->
    <div v-if="cfg.companyName || cfg.companyAddress || cfg.companyPhone" class="w-full mt-7">
      <div class="flex items-center gap-3 mb-3">
        <span class="text-xs font-bold tracking-widest shrink-0 opacity-85" style="color: #ffffff;">公司資訊</span>
        <div class="h-[1px] flex-1 bg-current opacity-20"></div>
      </div>
      <div class="w-full bg-white rounded-3xl p-5 shadow-sm text-gray-800">
        <h3 v-if="cfg.companyName" class="text-base font-black text-gray-900 mb-1">{{ cfg.companyName }}</h3>
        <p v-if="cfg.companyAddress" class="text-xs text-gray-500 mb-4">{{ cfg.companyAddress }}</p>
        <div class="grid grid-cols-2 gap-2.5">
          <a v-if="cfg.companyAddress" :href="'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(cfg.companyAddress)" target="_blank" class="py-2.5 rounded-xl text-white text-xs font-bold flex items-center justify-center gap-1.5 hover:opacity-90 transition" style="background-color: #1f2937;"><i class="ph ph-navigation-arrow"></i> 導航</a>
          <a v-if="cfg.companyPhone" :href="'tel:' + cfg.companyPhone" class="py-2.5 rounded-xl text-white text-xs font-bold flex items-center justify-center gap-1.5 hover:opacity-90 transition" style="background-color: #1f2937;"><i class="ph ph-phone"></i> 公司電話</a>
        </div>
      </div>
    </div>

    <!-- 分享這張名片 -->
    <button @click="shareCardNative" type="button" class="mt-8 inline-block text-xs font-bold tracking-widest underline underline-offset-4 hover:opacity-70 transition opacity-85 bg-transparent border-0 cursor-pointer" style="color: #ffffff;">{{ shareCopied ? '已複製名片訊息！' : '分享這張名片' }}</button>
    <p class="mt-6 text-xs font-medium tracking-wider opacity-50 text-center" style="color: #ffffff;">© 2026 露比設計數位科技有限公司</p>
  </div>

          const cfg = ref(decodeBase64Safe(RAW_C) || {});

            const parts = line.split(/[|｜]/);

          const buildServiceUrl = (u) => {
            const v = String(u || '').trim();
            if (!v) return '#';

            const v = String(val || "").trim();
            if (!v) return "#";
            if (v.startsWith("http")) return v;
            if (v.startsWith("@")) return "https://line.me/R/ti/p/" + encodeURIComponent(v);
            return "https://line.me/ti/p/~" + encodeURIComponent(v);
          };
          const buildFinalLink = (type, value) => {
            if (!value) return "#";
            if (type === "tel") return value.startsWith("tel:") ? value : "tel:" + value;
            if (type === "email") return value.startsWith("mailto:") ? value : "mailto:" + value;
            if (type === "line" || type === "line_personal") return buildLineAddUrl(value);
            if (!value.startsWith("http") && !value.startsWith("mailto:") && !value.startsWith("tel:")) return "https://" + value;
            return value;
          };
          const trackClickAsync = (btn, index) => {
            const targetUrl = btn['跳轉連結'] || btn.url;
            const memberId = profile.value['會員ID'];
            if (!memberId || !targetUrl) return;
            fetch(GAS_API_URL + "?action=trackClick&memberId=" + memberId + "&type=button&itemId=" + (btn['按鈕ID'] || btn.id || '') + "&btnIdx=" + (index + 1) + "&btnText=" + encodeURIComponent(btn['按鈕文字'] || btn.title || '') + "&url=" + encodeURIComponent(targetUrl), { mode: "no-cors" }).catch(()=>{});
          };
          const downloadVCard = () => {
            const vcard = ["BEGIN:VCARD", "VERSION:3.0", "FN:" + (profile.value['顯示名稱'] || ''), cfg.value.companyName ? "ORG:" + cfg.value.companyName : "", cfg.value.subtitle ? "TITLE:" + cfg.value.subtitle : "", cfg.value.contactPhone ? "TEL;TYPE=CELL:" + cfg.value.contactPhone : "", cfg.value.contactEmail ? "EMAIL:" + cfg.value.contactEmail : "", "END:VCARD"].filter(Boolean).join("\n");
            const blob = new Blob([vcard], { type: "text/vcard;charset=utf-8;" });
            const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = (profile.value['顯示名稱'] || 'card') + ".vcf"; a.click();
          };
          const shareCopied = ref(false);
          const shareCardNative = () => {
            const name = profile.value['顯示名稱'] || "我";
            const customPath = profile.value['個人頁個性化網址'] || profile.value['會員ID'];
            const cardUrl = customPath ? ("https://tuituicard.github.io/share/" + customPath + "/") : window.location.href;
            const introText = "哈囉！這是「" + name + "」的雲端名片，請點擊連結查看：";
            const fullText = introText + "\n" + cardUrl;

            if (navigator.clipboard && navigator.clipboard.writeText) {
              navigator.clipboard.writeText(fullText).catch(() => {});
            }

            if (navigator.share) {
              navigator.share({
                title: name + " - 專屬雲端名片",
                text: introText,
                url: cardUrl
              }).catch(() => {});
            } else {
              try {
                const ta = document.createElement('textarea');
                ta.value = fullText;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
              } catch (e) {}
              shareCopied.value = true;
              setTimeout(() => { shareCopied.value = false; }, 2000);
            }
          };
          return { profile, buttons, cfg, tagList, serviceRows, buildServiceUrl, getFontFamily, buildLineAddUrl, buildFinalLink, trackClickAsync, downloadVCard, shareCopied, shareCardNative };
        }
