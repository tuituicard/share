<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title><?= profile['顯示名稱'] ?> 的雲端名片</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body { font-family: 'Inter', sans-serif; background-color: <?= profile['背景主題顏色'] || '#FDF2F8' ?>; }
    .glass-card { background: rgba(255, 255, 255, 0.6); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.8); box-shadow: 0 10px 40px rgba(0,0,0,0.05); }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center py-10 px-4">

  <div class="w-full max-w-md glass-card rounded-3xl p-8 flex flex-col items-center relative overflow-hidden">
    <div class="w-28 h-28 rounded-full border-4 border-white shadow-lg overflow-hidden mb-5">
      <img src="<?= profile['大頭貼圖片URL'] ?>" class="w-full h-full object-cover">
    </div>
    
    <h1 class="text-2xl font-black text-gray-900 mb-2"><?= profile['顯示名稱'] ?></h1>
    <p class="text-sm text-gray-600 text-center whitespace-pre-wrap leading-relaxed mb-8 w-full"><?= profile['個人簡介文字'] ?></p>

    <button onclick="shareMyCard()" class="w-full bg-[#06C755] hover:bg-[#05b34c] text-white font-bold py-4 rounded-2xl mb-6 shadow-md transition flex items-center justify-center gap-2">
      <i class="ph-fill ph-chat-circle-text text-xl"></i> 將我的雲端名片傳到 LINE
    </button>

    <div class="w-full space-y-3">
      <? for(let i=0; i<buttons.length; i++) { ?>
        <a href="<?= buttons[i]['跳轉連結'] ?>" target="_blank" class="w-full flex items-center gap-3 p-3 rounded-2xl border border-white/50 shadow-sm" style="background-color: <?= buttons[i]['按鈕顏色'] || '#ffffff' ?>;">
          <div class="w-10 h-10 rounded-xl bg-white/60 flex items-center justify-center overflow-hidden shrink-0">
            <? if(buttons[i]['Icon圖片URL']) { ?><img src="<?= buttons[i]['Icon圖片URL'] ?>" class="w-full h-full object-cover"><? } else { ?><i class="ph ph-link text-gray-700"></i><? } ?>
          </div>
          <div class="flex-1 font-bold text-gray-800 text-center pr-10"><?= buttons[i]['按鈕文字'] ?></div>
        </a>
      <? } ?>
    </div>
  </div>

  <script>
    const flexMessageObj = <?= flexCarouselJson ?>;
    const LIFF_ID = "2009561347-VUhbtrEC"; 
    
    if (LIFF_ID !== "2009561347-VUhbtrEC") {
      liff.init({ liffId: LIFF_ID }).then(() => console.log("LIFF Ready"));
    }

    function shareMyCard() {
      if (LIFF_ID === "2009561347-VUhbtrEC") { alert("請先在後台設定 LIFF ID！"); return; }
      if (!liff.isLoggedIn()) { liff.login({ redirectUri: window.location.href }); return; }
      
      if (liff.isApiAvailable('shareTargetPicker')) {
        liff.shareTargetPicker([{ "type": "flex", "altText": "這是 <?= profile['顯示名稱'] ?> 的雲端名片", "contents": flexMessageObj }])
        .then(res => { if (res) alert("名片已成功發送！"); }).catch(err => console.error("分享失敗", err));
      } else { alert("請在 LINE App 內開啟此網頁即可轉發！"); }
    }
  </script>
</body>
</html>
